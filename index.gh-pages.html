<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="BunkrDownloader Pro — gerenciador de downloads de álbuns Bunkr" />
    <link rel="manifest" href="/bunkr-albums/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/bunkr-albums/icon.svg" />
    <link rel="apple-touch-icon" href="/bunkr-albums/icon.svg" />
    <title>BunkrDownloader Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before paint to prevent flash
      (function() {
        var saved = localStorage.getItem('bunkr-theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = saved || (prefersLight ? 'light' : 'dark');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.classList.toggle('light', theme === 'light');
      })();
    </script>
    <base href="/bunkr-albums/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/bunkr-albums/src/main.gh-pages.tsx"></script>
  </body>
</html>
