name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Capacitor
        run: |
          npx cap init "BunkrDownloader" "com.bunkr.downloader" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Add INTERNET permission
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/><application/' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bunkr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
